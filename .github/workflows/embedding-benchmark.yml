name: Embedding Benchmark

# Benchmark de acurácia pt-BR + performance (RSS/tempo/extrapolação) no runner
# real (ubuntu-latest). Fonte da decisão final do motor de embeddings (Fase 0B).
# NÃO é gate de PR — dispatch manual, reusável para futuros upgrades de modelo.
#
# Disparo: GitHub Actions → Run workflow → Embedding Benchmark
on:
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.14.6'
  PYTHONPATH: ${{ github.workspace }}
  PIP_NO_WARN_YANKED: 1
  PYTHONUNBUFFERED: '1'
  # fastembed pinado (regra #10): Área de validação da migração → lock em Fase 0C.
  # Reusar o mesmo pin do requirements-prod.in para não haver drift silencioso.
  FASTEMBED_VERSION: '0.8.0'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements-prod.lock
      - name: Install dependencies
        run: |
          # Instala deps do projeto exceto o motor de embeddings (que será
          # migrado). Instala fastembed pinado explicitamente.
          pip install -r requirements-prod.lock
          pip install "fastembed==${{ env.FASTEMBED_VERSION }}"
      - name: Record start time
        run: echo "CI_JOB_START=$(date +%s)" >> $GITHUB_ENV
      - name: Run embedding benchmark (accuracy + performance)
        id: benchmark
        run: python scripts/embedding_benchmark.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CI_JOB_START: ${{ env.CI_JOB_START }}
      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: embedding-benchmark-results
          path: data/embedding_benchmark_results.json
          if-no-files-found: warn
      - name: Check time budget
        run: python scripts/check_time_budget.py --timeout-minutes 30 --label "embedding-benchmark"
        env:
          CI_JOB_START: ${{ env.CI_JOB_START }}
