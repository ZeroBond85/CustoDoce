name: sanitize-check
on:
  schedule:
    - cron: '0 12 * * 1'  # Segunda 12h UTC (9h BRT)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sanitize-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitize-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
          cache: 'pip'
          cache-dependency-path: requirements-prod.lock
      - name: Install deps
        run: pip install -r requirements-prod.lock -q
        env:
          PIP_NO_WARN_YANKED: 1
      - name: Dry-run sanitize (fail if residue detected)
        run: |
          python scripts/sanitize.py --dry-run 2>&1
          echo ""
          echo "=== Nenhum residuo detectado. Working tree limpo. ==="
