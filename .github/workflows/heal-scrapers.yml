name: Heal Scrapers

on:
  schedule:
    # Mensal (dia 1) era limitado pelo "teto de 2.000 min/mês" fantasma.
    # Repo PÚBLICO = minutos de Actions ilimitados (LESSONS.md #127) →
    # heal a cada 12h (00:00/12:00 UTC) para scrapers se recuperarem
    # rapidamente de mudanças upstream (Cloudflare/mercado de encarte).
    - cron: '0 */12 * * *'

permissions:
  contents: read

jobs:
  scrape:
    concurrency:
      group: scrape-heal-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/scrape-reusable.yml
    with:
      mode: heal
    secrets:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      VIP_LOGIN_KEY: ${{ secrets.VIP_LOGIN_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HF_API_KEY: ${{ secrets.HF_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      GH_PAT: ${{ secrets.GH_PAT }}