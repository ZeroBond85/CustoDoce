name: CI - E2E Smoke Only

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit SHA'
        required: false
        default: 'master'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.14.6'
  PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
  PIP_NO_WARN_YANKED: 1
  STREAMLIT_DISABLE_CACHING_WARNING: 1

concurrency:
  group: ci-e2e-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || 'master' }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements-test.lock
      - run: pip install -r requirements-test.lock
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-test.lock') }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps
      - name: Start Streamlit local server
        run: |
          nohup streamlit run admin/app.py --server.port 8501 --server.headless true > /tmp/streamlit.log 2>&1 &
          echo "Waiting for Streamlit to become ready (real probe on log)..."
          READY=0
          for i in $(seq 1 60); do
            # Pronto de verdade: log indica app no ar E sem crash de startup
            if grep -q "You can now view your Streamlit app" /tmp/streamlit.log 2>/dev/null; then
              if ! grep -q "Traceback" /tmp/streamlit.log 2>/dev/null; then
                READY=1
                echo "Streamlit ready after $((i * 2))s"
                break
              fi
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo "::error::Streamlit failed to become ready in time. Last 40 lines of log:"
            tail -40 /tmp/streamlit.log
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      - name: E2E smoke — server + login + page crawl (19 pages)
        run: python -m pytest tests/e2e/test_e2e_smoke_basic.py -v --tb=short --no-header --durations=5
        env:
          STREAMLIT_URL: http://localhost:8501
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: e2e-smoke-screenshots
          path: tests/e2e/e2e_screenshots/
